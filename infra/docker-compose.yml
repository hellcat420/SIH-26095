services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dosje
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command:
      - sh
      - -c
      - if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '6379:6379'

  localstack:
    image: localstack/localstack:4.6.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '4566:4566'

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --dev --bind 0.0.0.0
    ports:
      - '7880:7880'
      - '7881:7881'
      - '5349:5349/udp'
      - '3478:3478/udp'
    environment:
      LIVEKIT_KEYS: "devkey: secretkey"
      LIVEKIT_HOST: '0.0.0.0:7880'

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    ports:
      - '8554:8554'
      - '8888:8888'
      - '8889:8889'
      - '8189:8189/udp'
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  api:
    build: ../apps/api
    depends_on:
      - postgres
      - redis
      - livekit
      - localstack
      - mediamtx
      - ai-service
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dosje
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_KEY: devkey
      LIVEKIT_SECRET: secretkey
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_REGION: us-east-1
      S3_BUCKET: dosje-media
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      MEDIA_MTX_API_URL: http://mediamtx:9997
      MEDIA_MTX_HLS_URL: http://localhost:8888
      AI_SERVICE_URL: http://ai-service:8000
      AUTH_DEMO_USERS_ENABLED: ${AUTH_DEMO_USERS_ENABLED:-true}
      OTP_GATEWAY_URL: ${OTP_GATEWAY_URL:-}
      OTP_GATEWAY_TOKEN: ${OTP_GATEWAY_TOKEN:-}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
      RTSP_ALLOWED_HOSTS: ${RTSP_ALLOWED_HOSTS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    ports:
      - '3000:3000'

  ai-service:
    build: ../services/ai-service
    environment:
      INSIGHTFACE_HOME: /models
    volumes:
      - ai-models:/models
    ports:
      - '8000:8000'

  dashboard:
    depends_on:
      - api
    build:
      context: ../apps/dashboard
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '5173:5173'

  mobile-build:
    image: ghcr.io/cirruslabs/flutter:stable
    profiles:
      - mobile
    working_dir: /workspace
    entrypoint: ['/bin/sh', '-c']
    command:
      - flutter pub get && flutter build apk --debug --dart-define=DOSJE_API_URL=$$DOSJE_API_URL
    environment:
      DOSJE_API_URL: ${DOSJE_API_URL:-http://10.0.2.2:3000}
    volumes:
      - ../apps/mobile:/workspace

volumes:
  pgdata:
  ai-models:
